# Manual, read-only diagnostic run against the Kalshi DEMO public API.
# Writes probe/demo_probe.json as a downloadable artifact (never deployed).
# Used to verify facts about the demo environment from a networked runner and to
# inspect the CORS headers a browser would receive.
name: Probe Kalshi demo API (read-only)

on:
  workflow_dispatch:
    inputs:
      collect:
        description: "Also run the full collector (slow, ~5 min)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe demo environment
        run: python3 scripts/probe_demo.py
      - name: Show CORS + summary
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("probe/demo_probe.json"))
          print("base:", d["api_base"], "exchange:", d.get("exchange_status"))
          print("series:", {k: v["series_count"] for k, v in d["topics"].items()})
          print("events:", {k: v["count"] for k, v in d["events"].items()})
          print("cors:", d.get("cors"))
          print("sample:", (d.get("samples") or {}).get("ticker"),
                "candles:", len(((d.get("samples") or {}).get("candlesticks", {}).get("body") or {}).get("candlesticks") or []),
                "trades:", len(((d.get("samples") or {}).get("trades", {}).get("body") or {}).get("trades") or []))
          print("errors:", len(d.get("errors", [])))
          PY
      - name: CORS preflight check (what a browser would see)
        run: |
          for U in "https://external-api.demo.kalshi.co/trade-api/v2/exchange/status" "https://external-api.demo.kalshi.co/trade-api/v2/markets?limit=1"; do
            echo "== $U"
            curl -s -D - -o /dev/null -m 20 -X OPTIONS -H "Origin: https://kanlerxz87-cyber.github.io" -H "Access-Control-Request-Method: GET" "$U" | tr -d '\r'
            echo "-- GET headers"
            curl -s -D - -o /dev/null -m 20 -H "Origin: https://kanlerxz87-cyber.github.io" "$U" | tr -d '\r' | grep -i -E "^access-control|^content-type|^HTTP/"
          done

      - name: Collect real demo data (for local verification)
        if: ${{ inputs.collect }}
        env:
          KALSHI_BASE: https://external-api.demo.kalshi.co/trade-api/v2
          OUT_DIR: probe/site-data
          STATE_PATH: probe/state.json
        run: python3 scripts/kalshi_collector.py

      - name: Summarise collected data
        if: ${{ inputs.collect }}
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("probe/site-data/markets.json"))
          e = json.load(open("probe/site-data/events.json"))
          c = json.load(open("probe/site-data/candles.json"))
          t = json.load(open("probe/site-data/ticks.json"))
          meta = json.load(open("probe/site-data/meta.json"))
          print("markets:", len(m["markets"]), "events:", len(e["events"]),
                "1m candle markets:", len(c["interval_1m"]), "60m:", len(c["interval_60m"]),
                "tape markets:", len(t["markets"]))
          print("meta:", {k: meta.get(k) for k in ("environment", "api_base", "open_markets_seen", "live_market_count", "markets_omitted_per_topic", "error_count")})
          print("top events:", [(x["event_ticker"], x["dollar_volume_24h_computed"]) for x in e["events"][:5]])
          k = next(iter(c["interval_1m"]), None)
          print("sample candle keys:", list((c["interval_1m"].get(k) or {}).keys()), "n=", len((c["interval_1m"].get(k) or {}).get("candles") or []))
          k2 = next(iter(t["markets"]), None)
          print("sample tape:", k2, len((t["markets"].get(k2) or {}).get("trades") or []))
          print("errors:", meta.get("errors")[:3])
          PY

      - name: Commit probe evidence to the branch
        run: |
          git config user.name "tradebot-probe"
          git config user.email "actions@users.noreply.github.com"
          git add -f probe
          git commit -m "chore(probe): demo API evidence + collected snapshot [skip ci]" || echo "nothing to commit"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: demo-probe
          path: probe/demo_probe.json
          retention-days: 7
