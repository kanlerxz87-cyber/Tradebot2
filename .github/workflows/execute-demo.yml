name: execute-demo (manual)

# Places one order on the Kalshi DEMO account. Manual only, and only when the
# demo credentials exist. The simulated (paper) ledger runs automatically in
# collect.yml and needs no credentials.
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Market ticker (e.g. KXAAAGASD-26NOV30-5.00)
        required: true
      side:
        description: "bid = buy YES, ask = sell YES"
        required: true
        default: bid
      count:
        description: Contracts (number)
        required: true
        default: "1"
      price:
        description: Limit price in dollars (0.01-0.99)
        required: true
        default: "0.05"

permissions:
  contents: read

jobs:
  order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Send order to the demo account
        env:
          KALSHI_DEMO_API_KEY_ID: ${{ secrets.KALSHI_DEMO_API_KEY_ID }}
          KALSHI_DEMO_PRIVATE_KEY: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY }}
        run: |
          python tools/execute_demo_order.py \
            --ticker "${{ inputs.ticker }}" \
            --side "${{ inputs.side }}" \
            --count "${{ inputs.count }}" \
            --price "${{ inputs.price }}" \
            --confirm
