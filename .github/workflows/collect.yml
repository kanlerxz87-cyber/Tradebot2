name: collect

# The collector must run on a machine with network access to Kalshi. GitHub
# runners have it; the agent sandbox that builds this repo does not (verified:
# TLS to *.kalshi.co is closed from the sandbox, see data/verify-api.json).
on:
  schedule:
    - cron: "*/5 * * * *"        # every 5 minutes; GitHub may delay scheduled runs
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**", "**.md"]

permissions:
  contents: write

concurrency:
  group: kalshi-data
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run one collection + analysis cycle
        env:
          KALSHI_DEMO_API_KEY_ID: ${{ secrets.KALSHI_DEMO_API_KEY_ID }}
          KALSHI_DEMO_PRIVATE_KEY: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY }}
        run: python collector/run.py --data-dir data
      - name: Verify data files
        run: python tools/verify_data.py --data-dir data
      - name: Commit refreshed data
        run: |
          git config user.name "tradebot2-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: automated cycle $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
