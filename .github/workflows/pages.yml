# Single Pages pipeline for this repository.
#
# GitHub Pages for this repo is configured as `build_type: legacy`, source `main:/`
# (verified through the Pages API: GET /repos/{owner}/{repo}/pages). Legacy Pages
# builds the repository root, so https://<owner>.github.io/Tradebot2/ serves the
# committed root files. There is no build step and no artifact upload: everything
# published must exist in the repo.
#
# This workflow therefore has one job: verify that what legacy Pages will publish
# is complete and internally consistent. It runs the engine tests, the canonical
# site checks and the live-dashboard checks. It must never contain a syntax error
# (a malformed `on:`/`jobs:` block makes GitHub refuse to start the workflow, which
# is exactly how the previous revision broke publishing).
name: Verify published site

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest

      - name: Engine tests
        run: python -m pytest -q

      - name: Canonical site data, required pages and local links
        run: python tools/verify_site.py

      - name: Archived generations internal links and sourced rows
        run: python scripts/check_site.py

      - name: Live dashboard headless tests
        run: |
          npm install --no-save --silent jsdom
          node live/tests/smoke.mjs

      - name: Live dashboard links, assets and fabrication check
        run: python3 live/tests/check_live.py

      # Added by session arena/d06c45b3: a quoted zero is an absent order, not a 0c
      # price, and a synthetic demo alert must stay badged. Both were real defects.
      - name: Quote rules — zero is not a price, no phantom fills, demo alerts badged
        run: node live/tests/quote_rules.mjs

      - name: No published page claims a directory that does not exist
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path('.')
          bad = []
          for p in list(root.glob('live/*.html')) + [root / 'index.html']:
              text = p.read_text(encoding='utf-8')
              for m in re.finditer(r'href="[^"]*?/?(legacy)/', text):
                  if not (root / 'legacy').exists():
                      bad.append(f'{p}: claims /legacy/ which is not in the repository')
          for line in sorted(set(bad)):
              print(line)
          sys.exit(1 if bad else 0)
          PY

      - name: Confirm the root is the publish target
        run: |
          test -f index.html
          test -f .nojekyll
          test -f live/index.html
          grep -q 'live/index.html' index.html
          echo "Legacy Pages publishes main:/ ; root index.html is the entry point and links the live dashboard."
