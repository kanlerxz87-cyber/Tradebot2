# Single Pages pipeline for this repository.
#
# GitHub Pages for this repo is configured as `build_type: legacy`, source `main:/`
# (verified through the Pages API: GET /repos/{owner}/{repo}/pages). Legacy Pages
# builds the repository root, so https://<owner>.github.io/Tradebot2/ serves the
# committed root files. There is no build step and no artifact upload: everything
# published must exist in the repo.
#
# This workflow therefore has one job: verify that what legacy Pages will publish
# is complete and internally consistent. It runs the engine tests, the canonical
# site checks and the live-dashboard checks. It must never contain a syntax error
# (a malformed `on:`/`jobs:` block makes GitHub refuse to start the workflow, which
# is exactly how the previous revision broke publishing).
name: Verify published site

# Keep PR checks (including forks). Event/ref-scoped concurrency below prevents
# push and PR runs from cancelling one another.
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_deployment:
        description: "Also verify the deployed Pages HTML/assets and public JSON (read-only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One group per ref + event, NOT one global group.
#
# With a single global `verify-pages` group, every push to any branch cancelled the
# verification run of every other branch. That is not harmless: a cancelled PR check
# is reported as a failed check, which hides real failures and blocks merges for
# reasons unrelated to the code. It bit this very PR (run 46059135289 cancelled at
# `actions/setup-node@v4` while another session pushed to its own branch).
#
# Scoping by ref keeps the property the original group was for — a newer push to the
# SAME branch cancels its own stale run — without cross-branch cancellation.
# `pull_request` gets its own suffix so the PR run and the push run for the same
# commit do not cancel each other either.
concurrency:
  group: verify-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest

      - name: Engine tests
        run: python -m pytest -q

      - name: Canonical site data, required pages and published-tree links
        run: |
          python tools/verify_site.py
          python tools/check_site.py --published

      - name: Data integrity (empty datasets and count drift fail here)
        run: python3 tools/audit_data.py --data-dir data

      - name: Archived generations internal links and sourced rows
        run: python scripts/check_site.py

      - name: Live dashboard headless tests
        run: |
          npm install --no-save --silent jsdom
          node live/tests/smoke.mjs
          node tests/test_frontend.mjs
          node tests/js/model-feed.test.mjs

      - name: Live dashboard links, assets and fabrication check
        run: python3 live/tests/check_live.py

      # Added by session arena/d06c45b3: a quoted zero is an absent order, not a 0c
      # price, and a synthetic demo alert must stay badged. Both were real defects.
      - name: Quote rules — zero is not a price, no phantom fills, demo alerts badged
        run: node live/tests/quote_rules.mjs

      - name: No published page claims a directory that does not exist
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path('.')
          bad = []
          for p in list(root.glob('live/*.html')) + [root / 'index.html']:
              text = p.read_text(encoding='utf-8')
              for m in re.finditer(r'href="[^"]*?/?(legacy)/', text):
                  if not (root / 'legacy').exists():
                      bad.append(f'{p}: claims /legacy/ which is not in the repository')
          for line in sorted(set(bad)):
              print(line)
          sys.exit(1 if bad else 0)
          PY

      - name: Confirm the root is the publish target
        run: |
          test -f index.html
          test -f .nojekyll
          test -f live/index.html
          grep -q 'live/index.html' index.html
          echo "Legacy Pages publishes main:/ ; root index.html is the entry point and links the live dashboard."

      # Dispatch after the legacy Pages build completes. This runs on a networked
      # runner and checks what the HTTPS site serves, not just the checkout.
      - name: Verify deployed Pages code and source capture (read-only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_deployment }}
        run: |
          python - <<'PY'
          import hashlib, json, os, time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse, quote
          import requests
          base = 'https://kanlerxz87-cyber.github.io/Tradebot2/'
          files = [Path('index.html')] + sorted(Path('live').glob('*.html'))
          files += sorted(Path('live/assets').rglob('*.js')) + sorted(Path('live/assets').rglob('*.css'))
          expected = {p.as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          session = requests.Session()
          deadline = time.monotonic() + 150
          while True:
              mismatches = []
              for name, digest in expected.items():
                  try:
                      r = session.get(base + name, params={'release-check': digest}, timeout=15)
                      if r.status_code != 200 or hashlib.sha256(r.content).hexdigest() != digest:
                          mismatches.append(name)
                  except requests.RequestException:
                      mismatches.append(name)
              if not mismatches:
                  break
              if time.monotonic() > deadline:
                  raise SystemExit('Published code missing/stale: ' + ', '.join(mismatches))
              print('Waiting for Pages propagation:', ', '.join(mismatches))
              time.sleep(10)
          # JSON may have been refreshed by a newer successful collector commit.
          # Validate its real served schema/provenance rather than requiring old prices.
          def read(name):
              r = session.get(base + name, params={'checked': int(time.time())}, timeout=20)
              r.raise_for_status()
              return r.json()
          capture = read('live/data/fallback-snapshot.json')
          assert capture['schema_version'] == 2 and capture['environment'] == 'demo'
          assert capture['provenance']['mode'] == 'official REST re-read'
          assert capture['provenance']['reverified_at']
          assert {m['topic'] for m in capture['markets']} == {'gas','elections','culture','crypto','golf'}
          assert len({m['ticker'] for m in capture['markets']}) == len(capture['markets']) > 0
          for m in capture['markets'] + capture['resolutions']:
              u = urlparse(m['source_url'])
              assert u.scheme == 'https' and u.netloc in {'external-api.demo.kalshi.co','demo-api.kalshi.co'}
              assert u.path == '/trade-api/v2/markets/' + quote(m['ticker'], safe='')
          account = read('live/data/account-verification.json')
          assert account['environment'] == 'demo' and account['read_only'] is True
          assert account['orders_submitted'] == 0
          if account['configured'] is not True:
              assert all(account[k] is None for k in ['balance','balance_dollars','portfolio_value','market_positions','event_positions'])
          proof = {'checked_at': datetime.now(timezone.utc).isoformat(), 'site':base,
                   'checkout_commit':os.environ['GITHUB_SHA'], 'http_200_and_exact_code_hashes':expected,
                   'public_capture_provenance':capture['provenance'], 'selected_markets':len(capture['markets']),
                   'account_status':account['status'], 'orders_submitted_by_check':0}
          Path('deployment-proof.json').write_text(json.dumps(proof, indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write('## Published Pages verified\n\n')
              fh.write(f'- {len(expected)} HTML/JS/CSS files: HTTPS 200 and exact checkout SHA-256 match.\n')
              fh.write(f"- {len(capture['markets'])} selected records: official source/provenance schema valid.\n")
              fh.write('- Account status: `' + account['status'] + '`. Orders sent: **0**.\n')
          print(json.dumps(proof, indent=2))
          PY
      - name: Retain HTTPS deployment proof
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_deployment }}
        uses: actions/upload-artifact@v4
        with:
          name: pages-deployment-proof
          path: deployment-proof.json
          retention-days: 14
