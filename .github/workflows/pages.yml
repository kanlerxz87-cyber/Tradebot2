# Single Pages pipeline for this repo. Only one Pages deployment can exist, so this file
# builds the whole published site in one artifact:
#   /            <- repo root: the source-linked dashboard (index.html, topics/, performance,
#                   resolutions, requirements, sources, flagged) plus every earlier page
#                   (gas-prices.html, elections.html, ..., docs/, EXECUTIVE_SUMMARY.md)
#   /monitor/    <- site/            (the parallel session's live monitor)
# `docs/` is published at /docs/ so the earlier dashboard is still reachable, and its own
# index is linked from the root page. Collected data (site/data) is generated at build time.
name: Deploy Kalshi Demo Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore collector state (history, alerts, paper trades)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: kalshi-state-${{ github.run_id }}
          restore-keys: |
            kalshi-state-

      - name: Collect public Kalshi data for the monitor
        run: python3 scripts/kalshi_collector.py

      - name: Check monitor site (links, sourced rows, data source fields)
        run: python3 scripts/check_site.py

      - name: Assemble Pages artifact (root dashboard + earlier pages + /monitor)
        run: |
          rm -rf _site
          mkdir -p _site/monitor _site/docs
          # Root: this branch's source-linked dashboard and every earlier root page.
          # tar (not rsync) because rsync is not guaranteed on the runner image.
          tar -cf - --exclude='./.git' --exclude='./_site' --exclude='./site' \
                   --exclude='./.github' --exclude='*/__pycache__' --exclude='./state' \
                   --exclude='./collector' --exclude='./tests' --exclude='./tools' \
                   --exclude='./scripts' --exclude='./requirements.txt' --exclude='./.gitignore' \
                   . | tar -xf - -C _site/
          # Earlier dashboard (kept verbatim) at /docs/
          cp -r docs/. _site/docs/
          # Parallel session's monitor at /monitor/
          cp -r site/. _site/monitor/
          ls -la _site | head -40

      - name: Check assembled site links
        run: SITE_DIR=_site/monitor python3 scripts/check_site.py --links-only-root _site

      - name: Check the root dashboard (links, required pages, data integrity)
        run: |
          python3 tools/check_site.py --root _site --strict
          python3 tools/verify_data.py --data-dir _site/data

      - name: Save collector state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: state
          key: kalshi-state-${{ github.run_id }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
